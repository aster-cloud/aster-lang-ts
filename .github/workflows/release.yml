name: Release

on:
  push:
    tags:
      - 'v*'
  # orchestrator 入口：dispatch 只创建 tag（用 CROSS_REPO_TOKEN，PAT 才能让 tag-push
  # 再触发 ci+publish），真正发布仍只走 tag-push 路径。详见 ADR 0023 阶段2。
  workflow_dispatch:
    inputs:
      version:
        description: '要发布的 npm 版本（不含 v 前缀），须等于 package.json version'
        required: true
        type: string
      artifactIds:
        required: false
        type: string
      trainId:
        required: false
        type: string
      forceTests:
        description: '发布 run 跑完整测试而不要求 main CI 已通过（ADR 0053 修订 A2 的逃生口）'
        required: false
        type: boolean
        default: false

concurrency:
  group: release-${{ github.repository }}-${{ inputs.version && format('v{0}', inputs.version) || github.ref_name }}
  cancel-in-progress: false

# 最小权限：默认 contents: read 覆盖所有 job。ci job 仅 checkout + build + test，read 足够。
# create-tag 用 CROSS_REPO_TOKEN（PAT）推 tag，publish 有各自 job 级块（contents: write +
# id-token: write）会覆盖顶层，保持不变。
permissions:
  contents: read

jobs:
  # dispatch 路径：仅创建 tag（用 PAT），让既有 tag-push ci+publish 复用。
  create-tag:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.CROSS_REPO_TOKEN }}
          fetch-depth: 0
      - name: Create & push release tag
        env:
          VERSION: ${{ inputs.version }}
          FORCE_TESTS: ${{ inputs.forceTests }}
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$VERSION" != "$PKG_VERSION" ]; then
            echo "::error::dispatch version ($VERSION) != package.json version ($PKG_VERSION)"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch --tags origin
          TAG="v${VERSION}"
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            TAG_SHA=$(git rev-list -n1 "$TAG"); HEAD_SHA=$(git rev-parse HEAD)
            if [ "$TAG_SHA" = "$HEAD_SHA" ]; then
              # ADR 0053 修订 A2：tag 已在本 commit 上时 dispatch 是 no-op，tag 消息不会再变；本次要求 forceTests 而已有
              # tag 不带标记，就明确失败，不让 forceTests 被静默忽略。
              if [ "$FORCE_TESTS" = "true" ] && ! git cat-file -p "refs/tags/$TAG" | grep -qxF "release-gate: force-tests"; then
                echo "::error::$TAG 已存在但不带 force-tests 标记，本次 forceTests=true 不会生效。该版本尚未发布时：删除远端 tag（git push origin :refs/tags/$TAG）后重新 dispatch；或让 main CI 变绿后重跑该 tag 的 publish run。"; exit 1
              fi
              echo "::notice::$TAG already on this commit → no-op (idempotent)"; exit 0
            fi
            echo "::error::$TAG exists but points to $TAG_SHA, not HEAD $HEAD_SHA"; exit 1
          fi
          # ADR 0053 修订 A2：forceTests 时打 annotated tag，消息带标记，tag-push 的发布 run 据此跑完整测试。
          if [ "$FORCE_TESTS" = "true" ]; then
            git tag -a "$TAG" -m "release-gate: force-tests"
          else
            git tag "$TAG"
          fi
          git push origin "$TAG"

  # ADR 0053 修订 A2：发布的 commit 必须已在 main CI 上通过（ci.yml 的 test (24) 是 typecheck / lint /
  # 单测 / 集成 / golden / property / fuzz 的超集），发布 run 不再重跑测试。
  # tag 带「release-gate: force-tests」时门禁跳过，由下面的 full-tests 跑完整测试。
  gate:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      force-tests: ${{ steps.ci-gate.outputs.force-tests }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Require main CI green for this commit
        id: ci-gate
        uses: aster-cloud/aster-lang-platform/.github/actions/require-main-ci-green@main

  # 完整测试：只在 force-tests 时跑（内容即此前每次发布都跑的 ci job）。
  full-tests:
    needs: gate
    if: github.event_name == 'push' && needs.gate.outputs.force-tests == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # ★错误码单源门禁（error-codes-parity）需要 aster-lang-core 并列存在。
      #
      #   2026-08-19 发版列车 layer 4 实测：本 workflow 此前不 checkout core，
      #   于是那条断言按 fail-closed 设计报错并中断发布：
      #     「CI 中必须 checkout aster-lang-core 才能校验错误码单源一致性」
      #
      #   ★该 fail-closed 是**有意加的**（本轮审计 aster-lang-ts#105）：此前它写
      #     `try { ... } catch { return; }`，而 CI 从不 checkout core，
      #     于是这条跨仓 byte-identical 断言**恒被跳过** —— 「跳过与通过不可区分
      #     的门禁不是门禁」。故正确修法是补上兄弟仓，而非放宽守卫。
      #
      #   ci.yml 早已 checkout core（14 处引用），本文件此前遗漏。
      - name: Checkout aster-lang-core (错误码单源门禁需要)
        uses: aster-cloud/aster-lang-platform/.github/actions/checkout-sibling@main
        with:
          repository: aster-cloud/aster-lang-core
          path: aster-lang-core
          token: ${{ secrets.CROSS_REPO_TOKEN }}

      # ★全语料格式化往返、lossless 镜像、W704 黄金三组用例直读 aster-lang-test 源文，
      #   缺兄弟仓即 fail-closed（与 ci.yml test job 同一 checkout 方式；tag 构建取同名 tag）。
      #   1.0.31 列车 layer 4 实测：本文件此前只补了 core，漏了 test。
      - name: Checkout aster-lang-test (全语料与黄金用例需要)
        uses: aster-cloud/aster-lang-platform/.github/actions/checkout-sibling@main
        with:
          repository: aster-cloud/aster-lang-test
          path: aster-lang-test
          token: ${{ secrets.CROSS_REPO_TOKEN }}

      # Core IR v2（ADR 0055 §3）：schema 副本 parity 与 readCoreIr 负例夹具直读 locales 的
      # core-ir/，缺失即失败（test/helpers/locales-core-ir.ts）。与 ci.yml 保持一致。
      - name: Checkout aster-lang-locales
        uses: aster-cloud/aster-lang-platform/.github/actions/checkout-sibling@main
        with:
          repository: aster-cloud/aster-lang-locales
          path: aster-lang-locales
          token: ${{ secrets.CROSS_REPO_TOKEN }}

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      # 单测（core-ir-conformance 等）与 golden 都读兄弟 checkout 的语料（scripts/corpus-loader.ts），
      # 须在单测之前构建其 loader 产物；兄弟仓嵌在本仓工作区内，须忽略本仓 pnpm-workspace.yaml。
      - name: Build aster-lang-test corpus loader
        working-directory: aster-lang-test/packages/js
        run: pnpm install --frozen-lockfile --ignore-workspace && pnpm run build

      - name: Run tests
        run: pnpm run test

      - name: Run golden tests
        run: pnpm run test:golden

  # 门禁通过（或 force-tests 下完整测试通过）后才发布。条件写全两种合法组合，其余（门禁失败、
  # force-tests 却没跑测试、测试失败）一律不发布。
  publish:
    needs: [gate, full-tests]
    if: >-
      !cancelled() && needs.gate.result == 'success' && (
        (needs.gate.outputs.force-tests == 'true' && needs.full-tests.result == 'success') ||
        (needs.gate.outputs.force-tests == 'false' && needs.full-tests.result == 'skipped'))
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # 发布 job 只构建与打包（prepublishOnly：clean → build → browser 入口检查 → 发布包冒烟），
      # 不跑测试，故不再检出 core / test / locales，也不构建语料 loader（ts#318 / ts#319 两次补的正是它们）。
      # 构建本身不读兄弟仓（已在无兄弟仓的隔离目录里验证 `pnpm run build`）。
      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Verify package version matches tag
        run: |
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Error: Tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)"
            exit 1
          fi

      - name: Publish to npm (Trusted Publisher)
        run: pnpm publish --no-git-checks --provenance

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          draft: false

      # 单文件 runner（ADR 0059 P1 T5）：dist/runner/aster.mjs 与其 sha256 作为 Release 资产上传，
      # 再下载回读，校验 sha256 并与本次构建产物逐字节比较，确认资产即发布的那一份。
      - name: Upload single-file runner (aster.mjs + sha256)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" dist/runner/aster.mjs dist/runner/aster.mjs.sha256 --clobber --repo "$GITHUB_REPOSITORY"
          CHECK=$(mktemp -d)
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'aster.mjs' --pattern 'aster.mjs.sha256' --dir "$CHECK"
          (cd "$CHECK" && sha256sum -c aster.mjs.sha256)
          cmp "$CHECK/aster.mjs" dist/runner/aster.mjs

      # 下游升级不再由本 workflow 推送触发：aster-cloud 与 aster-dev 各自的 auto-upgrade.yml
      # 每日定时拉取 npm 最新版并开升级 PR（跨 org 凭据刻意不放宽，原派发一直 403）；
      # aster-lang-dev 已归档（由 aster-dev 取代）。
      # 规则不变：日后若再加下游尽力而为的步骤，必须 continue-on-error，已成功的发布绝不能因其变红（ADR 0023 §9）。
